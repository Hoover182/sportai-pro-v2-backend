name: NBA probe - acceso a nba_api desde Actions

# Fase 0 de NBA: una sola corrida para saber si stats.nba.com responde
# desde un runner de GitHub (IP de nube). No escribe nada en el repo.
# Segunda prueba (nba_probe_cdn.py): si el CDN alcanza para el historial.
# workflow_dispatch solo aparece cuando el archivo esta en main; mientras
# vive en la rama, se dispara con un push que toque este archivo.
on:
  workflow_dispatch: {}
  push:
    branches: [feat/nba-base]
    paths: [.github/workflows/nba-probe.yml, scripts/nba_probe_cdn.py]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install nba_api requests

      - run: python scripts/nba_probe_cdn.py

      # Muestras crudas para escribir el parser del sync (desde la PC el
      # CDN da 403).
      - name: Bajar muestras crudas
        run: |
          mkdir -p muestras
          H='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.88 Safari/537.36'
          for g in 0022500001 0042500405 0052500101 0062500001 0012600001 0022501231; do
            curl -s -H "$H" -o muestras/boxscore_$g.json -w "$g %{http_code}\n" https://cdn.nba.com/static/json/liveData/boxscore/boxscore_$g.json
            sleep 1
          done
          curl -s -H "$H" -o muestras/schedule.json -w "schedule %{http_code}\n" https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json

      - uses: actions/upload-artifact@v4
        with:
          name: muestras-cdn
          path: muestras/
