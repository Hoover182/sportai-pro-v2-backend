name: NBA probe - acceso a nba_api desde Actions

# Fase 0 de NBA: una sola corrida para saber si stats.nba.com responde
# desde un runner de GitHub (IP de nube). No escribe nada en el repo.
# Segunda prueba (nba_probe_cdn.py): si el CDN alcanza para el historial.
# workflow_dispatch solo aparece cuando el archivo esta en main; mientras
# vive en la rama, se dispara con un push que toque este archivo.
on:
  workflow_dispatch: {}
  push:
    branches: [feat/nba-base]
    paths: [.github/workflows/nba-probe.yml, scripts/nba_probe_cdn.py]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install nba_api requests

      - run: python scripts/nba_probe_cdn.py

      # Muestras crudas para escribir el parser del sync (desde la PC el
      # CDN da 403). Con Python y no curl: Akamai le da 403 a curl aun
      # desde Actions (huella TLS), a requests no.
      - name: Bajar muestras crudas
        shell: python
        run: |
          import os, time, requests
          from nba_api.live.nba.library.http import STATS_HEADERS
          os.makedirs("muestras", exist_ok=True)
          base = "https://cdn.nba.com/static/json"
          rutas = [f"liveData/boxscore/boxscore_{g}.json" for g in (
              "0022500001", "0042500405", "0052500101", "0062500001",
              "0012600001", "0022501231")]
          rutas.append("staticData/scheduleLeagueV2.json")
          for r in rutas:
              resp = requests.get(f"{base}/{r}", headers=STATS_HEADERS, timeout=30)
              print(r, resp.status_code, len(resp.content))
              open(f"muestras/{r.rsplit('/', 1)[1]}", "wb").write(resp.content)
              time.sleep(0.6)

      - uses: actions/upload-artifact@v4
        with:
          name: muestras-cdn
          path: muestras/
