name: Alerta - datos viejos en produccion

# Se mergeo el 21/10 durante una caida de webhooks de GitHub y nunca quedo
# registrado (0 corridas hasta el 29/10). Este comentario fuerza el registro.

on:
  schedule:
    # Cada 6 horas: el issue se abre en la primera medicion que pase el
    # umbral de 36 h (ver scripts/alerta_datos_viejos.py).
    - cron: "30 */6 * * *"
  workflow_dispatch:      # permite dispararlo a mano desde la pestaña Actions
    inputs:
      prueba_telegram:
        description: "Solo mandar un Telegram de prueba (no toca issues)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: alerta-datos-viejos
  cancel-in-progress: false

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Medir /futbol/meta, abrir/cerrar el issue y avisar por Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ inputs.prueba_telegram }}
        run: |
          if [ "$PRUEBA" = "true" ]; then
            python scripts/alerta_datos_viejos.py --prueba-telegram
          else
            python scripts/alerta_datos_viejos.py
          fi
