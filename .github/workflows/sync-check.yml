name: Sync check - analista-futbol -> backend

on:
  schedule:
    # 12:00 UTC = 2h despues del cron de analista-futbol (10:00 UTC),
    # para darle margen a que termine su corrida completa.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write
  pull-requests: write

# Una sola sync a la vez (schedule + disparo manual no se pisan).
concurrency:
  group: sync-check
  cancel-in-progress: false

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt completo: la prueba de humo del veredicto importa
      # el codigo real del backend.
      - run: pip install -r requirements.txt

      - name: Chequear cambios y armar reporte
        id: check
        run: |
          set +e
          python scripts/check_sync.py \
            --write-csv app/services/futbol_partidos.csv.new \
            --write-teamids app/services/cache_team_ids.json.new \
            --write-cuotas app/services/cuotas_cache.json.new \
            --summary-out /tmp/summary.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = sin cambios, 2 = hay cambios (se arma el PR). Cualquier otro
          # codigo es un error del script y el job TIENE que fallar: del
          # 2026-09-20 al 2026-09-25 un KeyError salia con 1, se tomaba como
          # "sin cambios" y la corrida quedaba en verde sin sincronizar nada.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::check_sync.py fallo con codigo $code (ver el traceback arriba). No se sincronizo nada."
            exit "$code"
          fi

      - name: Reemplazar archivos y armar rama
        if: steps.check.outputs.exit_code == '2'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          BRANCH="sync/analista-futbol-$(date -u +%Y%m%d-%H%M)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          # Commit de main contra el que compara el veredicto.
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          # Cada .new solo existe si ese archivo puntual tuvo cambios --
          # el otro puede no haber cambiado ese dia (ver check_sync.py).
          if [ -f app/services/futbol_partidos.csv.new ]; then
            mv app/services/futbol_partidos.csv.new app/services/futbol_partidos.csv
            git add app/services/futbol_partidos.csv
          fi
          if [ -f app/services/cache_team_ids.json.new ]; then
            mv app/services/cache_team_ids.json.new app/services/cache_team_ids.json
            git add app/services/cache_team_ids.json
          fi
          if [ -f app/services/cuotas_cache.json.new ]; then
            mv app/services/cuotas_cache.json.new app/services/cuotas_cache.json
            git add app/services/cuotas_cache.json
          fi
          # Timestamp real de esta sincronizacion, para el subtitulo
          # "actualizado hace X min" del frontend -- NUNCA usar mtime de
          # los archivos de datos en el backend (git checkout en cada
          # deploy de Render lo pisa con la hora del deploy, no la de
          # este sync).
          printf '{\n  "datos_actualizados_en": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app/services/datos_meta.json
          git add app/services/datos_meta.json
          git commit -m "Sync: actualizar datos desde analista-futbol"
          git push origin "$BRANCH"

      - name: Abrir Pull Request
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sync datos desde analista-futbol ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/summary.md \
            --base main \
            --head "$BRANCH"

      # Veredicto de auto-merge (MODO REAL desde 2026-10-07, despues de la
      # observacion del 26/09 al 07/10: 14 PRs, 13 AUTO correctos, 1 MANUAL
      # con motivo real). Lo comenta en el PR. Si es "revision manual", o el
      # script del veredicto falla, la corrida termina en ROJO para que
      # GitHub avise por mail y el PR queda abierto -- nunca un verde que
      # esconda un problema. Si es AUTO, los pasos siguientes mergean.
      - name: Veredicto de auto-merge
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/antes /tmp/despues
          for f in futbol_partidos.csv cache_team_ids.json cuotas_cache.json datos_meta.json; do
            git show "$BASE_SHA:app/services/$f" > "/tmp/antes/$f" 2>/dev/null || rm -f "/tmp/antes/$f"
            cp "app/services/$f" "/tmp/despues/$f" 2>/dev/null
          done
          git diff --name-only "$BASE_SHA" HEAD > /tmp/archivos.txt
          python scripts/veredicto_sync.py \
            --antes-dir /tmp/antes --despues-dir /tmp/despues \
            --archivos-cambiados /tmp/archivos.txt \
            --out /tmp/veredicto.json --comentario /tmp/veredicto.md
          v=$?
          if [ "$v" -ne 0 ] && [ "$v" -ne 3 ]; then
            {
              echo "## Veredicto de auto-merge"
              echo
              echo "⛔ **El script del veredicto fallo (codigo $v): sin veredicto = revision manual.** Ver el log de la corrida."
            } > /tmp/veredicto.md
          fi
          gh pr comment "$BRANCH" --repo "$GITHUB_REPOSITORY" --body-file /tmp/veredicto.md || { echo "::error::No se pudo comentar el veredicto en el PR"; exit 1; }
          if [ "$v" -ne 0 ]; then
            echo "::error::Veredicto: revision manual (codigo $v). El PR queda abierto; motivos en el comentario del PR."
            exit 1
          fi
          echo "Veredicto: AUTO. El paso siguiente mergea el PR."

      # Solo llega aca con veredicto AUTO (si el paso anterior falla, este
      # se saltea). --match-head-commit: mergea exactamente el commit que
      # se evaluo. Reintenta porque GitHub tarda unos segundos en calcular
      # si un PR recien creado es mergeable.
      - name: Auto-merge del PR de sync
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          for intento in 1 2 3 4 5; do
            if gh pr merge --repo "$GITHUB_REPOSITORY" "$BRANCH" --merge --match-head-commit "$SHA"; then break; fi
            sleep 15
          done
          estado=$(gh pr view --repo "$GITHUB_REPOSITORY" "$BRANCH" --json state --jq .state)
          if [ "$estado" != "MERGED" ]; then
            echo "::error::Veredicto AUTO pero el merge fallo (estado $estado). El PR queda abierto para revision manual."
            exit 1
          fi
          NUM=$(gh pr view --repo "$GITHUB_REPOSITORY" "$BRANCH" --json number --jq .number)
          echo "NUM=$NUM" >> "$GITHUB_ENV"
          gh pr comment --repo "$GITHUB_REPOSITORY" "$BRANCH" --body "🤖 Mergeado automaticamente: veredicto AUTO (todos los criterios en verde). El paso siguiente verifica que produccion sirva los datos nuevos." || true
          # Los PRs de sync viejos que quedaron abiertos (por un veredicto
          # MANUAL anterior) quedan reemplazados: cada sync sale de main y
          # reescribe los mismos archivos de datos desde analista-futbol.
          for viejo in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"sync/analista-futbol-\")) | select(.number != $NUM) | .number"); do
            gh pr close --repo "$GITHUB_REPOSITORY" "$viejo" --comment "Cerrado sin mergear: reemplazado por #$NUM (sync del $(date -u +%Y-%m-%d)), que sale de main, reescribe los mismos archivos de datos desde analista-futbol y se mergeo automaticamente con todos los criterios del veredicto en verde." \
              || echo "::warning::No se pudo cerrar el PR viejo #$viejo"
          done

      # Criterio E: produccion (Render) tiene que servir los datos nuevos.
      # Si no se actualiza en 20 minutos o /partidos-hoy responde mal, la
      # corrida termina en ROJO (mail de GitHub) y se avisa en el PR.
      - name: Criterio E - verificar produccion despues del merge
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail   # el resultado es el de verificar_produccion.py, no el de tee
          if ! python scripts/verificar_produccion.py --timeout-min 20 | tee /tmp/verificacion.txt; then
            gh pr comment --repo "$GITHUB_REPOSITORY" "$NUM" --body "⛔ **Criterio E fallo despues del merge automatico:** $(tail -1 /tmp/verificacion.txt). Revisar el deploy de Render." || true
            echo "::error::Produccion no quedo al dia despues del merge automatico."
            exit 1
          fi
