name: Sync check - analista-futbol -> backend

on:
  schedule:
    # 12:00 UTC = 2h despues del cron de analista-futbol (10:00 UTC),
    # para darle margen a que termine su corrida completa.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write
  pull-requests: write

# Una sola sync a la vez (schedule + disparo manual no se pisan).
concurrency:
  group: sync-check
  cancel-in-progress: false

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt completo: la prueba de humo del veredicto importa
      # el codigo real del backend.
      - run: pip install -r requirements.txt

      - name: Chequear cambios y armar reporte
        id: check
        run: |
          set +e
          python scripts/check_sync.py \
            --write-csv app/services/futbol_partidos.csv.new \
            --write-teamids app/services/cache_team_ids.json.new \
            --write-cuotas app/services/cuotas_cache.json.new \
            --summary-out /tmp/summary.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = sin cambios, 2 = hay cambios (se arma el PR). Cualquier otro
          # codigo es un error del script y el job TIENE que fallar: del
          # 2026-09-20 al 2026-09-25 un KeyError salia con 1, se tomaba como
          # "sin cambios" y la corrida quedaba en verde sin sincronizar nada.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::check_sync.py fallo con codigo $code (ver el traceback arriba). No se sincronizo nada."
            exit "$code"
          fi

      - name: Reemplazar archivos y armar rama
        if: steps.check.outputs.exit_code == '2'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          BRANCH="sync/analista-futbol-$(date -u +%Y%m%d-%H%M)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          # Commit de main contra el que compara el veredicto.
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          # Cada .new solo existe si ese archivo puntual tuvo cambios --
          # el otro puede no haber cambiado ese dia (ver check_sync.py).
          if [ -f app/services/futbol_partidos.csv.new ]; then
            mv app/services/futbol_partidos.csv.new app/services/futbol_partidos.csv
            git add app/services/futbol_partidos.csv
          fi
          if [ -f app/services/cache_team_ids.json.new ]; then
            mv app/services/cache_team_ids.json.new app/services/cache_team_ids.json
            git add app/services/cache_team_ids.json
          fi
          if [ -f app/services/cuotas_cache.json.new ]; then
            mv app/services/cuotas_cache.json.new app/services/cuotas_cache.json
            git add app/services/cuotas_cache.json
          fi
          # Timestamp real de esta sincronizacion, para el subtitulo
          # "actualizado hace X min" del frontend -- NUNCA usar mtime de
          # los archivos de datos en el backend (git checkout en cada
          # deploy de Render lo pisa con la hora del deploy, no la de
          # este sync).
          printf '{\n  "datos_actualizados_en": "%s"\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app/services/datos_meta.json
          git add app/services/datos_meta.json
          git commit -m "Sync: actualizar datos desde analista-futbol"
          git push origin "$BRANCH"

      - name: Abrir Pull Request
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Sync datos desde analista-futbol ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/summary.md \
            --base main \
            --head "$BRANCH"

      # MODO OBSERVACION: calcula si el PR se habria auto-mergeado y lo
      # comenta en el PR. NUNCA mergea (no hay ningun "gh pr merge" en este
      # workflow). Si el veredicto es "revision manual", o el script del
      # veredicto falla, la corrida termina en ROJO para que GitHub avise
      # por mail -- nunca un verde que esconda un problema.
      - name: Veredicto de auto-merge (modo observacion, no mergea)
        if: steps.check.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/antes /tmp/despues
          for f in futbol_partidos.csv cache_team_ids.json cuotas_cache.json datos_meta.json; do
            git show "$BASE_SHA:app/services/$f" > "/tmp/antes/$f" 2>/dev/null || rm -f "/tmp/antes/$f"
            cp "app/services/$f" "/tmp/despues/$f" 2>/dev/null
          done
          git diff --name-only "$BASE_SHA" HEAD > /tmp/archivos.txt
          python scripts/veredicto_sync.py \
            --antes-dir /tmp/antes --despues-dir /tmp/despues \
            --archivos-cambiados /tmp/archivos.txt \
            --out /tmp/veredicto.json --comentario /tmp/veredicto.md
          v=$?
          if [ "$v" -ne 0 ] && [ "$v" -ne 3 ]; then
            {
              echo "## Veredicto de auto-merge (MODO OBSERVACION)"
              echo
              echo "⛔ **El script del veredicto fallo (codigo $v): sin veredicto = revision manual.** Ver el log de la corrida."
            } > /tmp/veredicto.md
          fi
          gh pr comment "$BRANCH" --body-file /tmp/veredicto.md || { echo "::error::No se pudo comentar el veredicto en el PR"; exit 1; }
          if [ "$v" -ne 0 ]; then
            echo "::error::Veredicto: NO se habria auto-mergeado (codigo $v). Motivos en el comentario del PR."
            exit 1
          fi
          echo "Veredicto: se habria auto-mergeado (modo observacion: no se mergeo)."
